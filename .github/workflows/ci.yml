name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（lint + 类型 + 测试 + 评测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 格式检查（ruff format）
        run: ruff format --check .

      - name: 类型检查（mypy）
        run: mypy homemind
        continue-on-error: true # 渐进式收紧：先保证新代码正确，存量问题逐步清理

      - name: 单元测试
        # 全部用例零外部依赖：不需要 MySQL、不需要 API Key、不需要网络
        run: pytest -q

      - name: 离线评测（规则模式）
        # 行为基线：82 条用例，改动若偏离既有行为会在这里失败
        run: python -m evals.runner

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
