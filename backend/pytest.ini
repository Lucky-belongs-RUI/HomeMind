; pytest 配置
;
; 测试必须零外部依赖：不需要 MySQL、不需要 LLM API Key、不需要网络。
; 需要数据库的节点逻辑由 evals/ 覆盖（用标准家庭 + 规则引擎做行为验证）。
;
; 使用：
;   pytest                 ; 跑全部
;   pytest tests/test_agent_state_policy.py -v
;   pytest -m "not slow"

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -q 精简输出；--strict-markers 防止把拼错的 marker 当成通过
addopts = -q --strict-markers --tb=short
; 异步用例显式标注 @pytest.mark.asyncio（strict 模式）
asyncio_default_fixture_loop_scope = function

; 异步用例不使用 pytest-asyncio：该插件未在依赖清单中，
; 若直接写 `async def test_*` 会被静默跳过（全绿但没跑）。
; 因此涉及数据库的用例统一用 asyncio.run() 包裹场景函数，见 tests/db.py。
; 若将来引入 pytest-asyncio，可删除本说明并加回 `asyncio_mode = auto`。

markers =
    slow: 需要外部依赖或耗时较长的用例
