# Alembic configuration for schema versioning.
#
# NOTE: this file is intentionally ASCII-only.
# `configparser` reads it with the platform default encoding, which is GBK on
# Chinese Windows -- any non-ASCII byte here breaks every alembic command with
# UnicodeDecodeError. Keep explanations in migrations/README.md instead.
#
# Common commands (run from backend/):
#   alembic upgrade head                        apply all pending migrations
#   alembic downgrade -1                        roll back one revision
#   alembic current                             show current revision
#   alembic history --verbose                   show revision history
#   alembic revision --autogenerate -m "msg"    generate a migration from model diff
#   alembic upgrade head --sql                  print SQL only, no DB connection
#
# The database URL is NOT hardcoded here: migrations/env.py reads it from
# Settings (same .env as the app), so the address lives in exactly one place.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp prefix keeps revision files ordered by creation time.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
