# mypy 静态类型检查配置
#
# 策略：**渐进式收紧**。
# 存量代码的类型注解完整度不一（有的用 Dict[str, Any]，有的用 dict），
# 一上来开 strict 会产生大量错误、失去可操作性。
# 目标顺序：先把新代码保持在类型正确的基础上 → 清理存量 → 再开 strict。
#
# 使用：mypy app

[mypy]
python_version = 3.11

# 第三方库大多没有类型存根，不因缺少类型信息而报错
ignore_missing_imports = True

# 检查未注解函数的函数体（能抓出真实的类型错误，且不需要先补全注解）
check_untyped_defs = True

# 其它务实开关
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

exclude = (?x)(
    ^chroma_data/
    | ^uploads/
    | ^evals/reports/
    | ^\.venv/
)

# 这些库要么无类型存根，要么类型定义不稳定，单独放宽
[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-langgraph_checkpoint_postgres.*]
ignore_missing_imports = True

[mypy-langchain*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-whisper.*]
ignore_missing_imports = True

[mypy-edge_tts.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
